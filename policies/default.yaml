# LLMGuard Default Privacy Policy
# =================================
# Maps entity types to privacy actions.
# Actions: ALLOW, PSEUDONYMIZE, GENERALIZE, REDACT, BLOCK
#
# The walking skeleton (v1) uses PSEUDONYMIZE for all detected entities.
# This file will be extended with fine-grained rules in later phases.

version: "1.0"
description: "Default privacy policy — pseudonymize all detected PII"

# Global confidence threshold for PII detection
detection_threshold: 0.7

# Per-entity-type actions
entity_policies:
  PERSON:
    action: PSEUDONYMIZE
    description: "Replace names with indexed placeholders"

  EMAIL_ADDRESS:
    action: PSEUDONYMIZE
    description: "Replace email addresses with indexed placeholders"

  PHONE_NUMBER:
    action: PSEUDONYMIZE
    description: "Replace phone numbers with indexed placeholders"

  LOCATION:
    action: PSEUDONYMIZE
    description: "Replace locations with indexed placeholders"

  DATE_TIME:
    action: ALLOW
    description: "Allow dates and times to pass through"

  # Catch-all for any other Presidio-detected entity type
  DEFAULT:
    action: PSEUDONYMIZE
    description: "Pseudonymize any unspecified entity type"

# Request-level blocking rules (future)
# block_rules:
#   - condition: "entity_count > 10"
#     action: BLOCK
#     message: "Too many PII entities detected. Request blocked."

